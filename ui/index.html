<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Assistant</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/assets/theme.css"></head>
<body><main class="voice-page">
  <button class="voice-talk" id="voiceButton" type="button" aria-pressed="false">
    <span class="voice-orb" aria-hidden="true">🎙</span>
    <span class="voice-label" id="voiceLabel">Hold to talk</span>
  </button>
  <p class="voice-status" id="voiceStatus">Connecting…</p>
  <div class="voice-exchange" id="voiceExchange" hidden>
    <div class="voice-line"><span>You</span><p id="voiceTranscript"></p></div>
    <div class="voice-line reply"><span>Assistant</span><p id="voiceReply"></p></div>
  </div>
</main><script src="voice.js"></script></body></html>
