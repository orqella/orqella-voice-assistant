# Voice Assistant engine config. Edit this file (or ask Orqella's agent) to add
# house modes, applications, Home Assistant entities, and other routes.

[audio]
source = ""
rate = 16000
max_seconds = 90
beep = false

[stt]
model = "small.en"
device = "cpu"
compute_type = "int8"
language = "en"
download_root = "models"
vad = true

[input]
wake_words = ["voice assistant", "assistant"]
default_mode = "command"
# Built-in time/date/status/lock/workspace phrases. A fresh install ships with
# no routes, so they stay off until this is set to true.
builtin_routes = false

[ha]
url = "http://127.0.0.1:8123"
# Leave empty to use HA_TOKEN or configure a token command for your password store.
token_command = []
state_entity = "sensor.voice_assistant_state"

[llm]
enabled = false
base_url = "http://127.0.0.1:1234/v1"
model = ""
timeout = 25
temperature = 0.1

[api]
host = "127.0.0.1"
port = 8790
token = ""

[system]
# Leave empty to use the platform default (loginctl, pmset, or Windows lock).
lock = []

[apps]
# Add commands for apps you want voice shortcuts to launch, for example:
# terminal = ["foot"]

# Add house modes as [[mode]] tables with [mode.actions] entries.


[opencode]
# Optional MCP bridge for "opencode ..." voice routes. Leave blank to disable.
bridge = ""
node = ""
default_dir = "~"
start_timeout = 40
status_timeout = 20
# Let the agent edit/run without permission prompts. Keep false unless trusted.
auto_approve = false
# Store full prompts in data/state/opencode.log. Off by default: prompts may
# contain private text.
log_prompts = false
