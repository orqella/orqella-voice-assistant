name: ci

# Automatic CI is paused to conserve GitHub Actions minutes. Run it from the
# Actions tab (or `gh workflow run ci`) when a manual check is wanted.
# Restore automatic runs by replacing the trigger below with:
#   on: [push, pull_request]
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --check ui/settings.js && node --check ui/voice.js
