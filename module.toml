schema = 1
id = "voice-assistant"
name = "Voice Assistant"
version = "0.1.3"
api_version = "1"
description = "Hold-to-talk voice commands with a managed route catalog."
overview = "ui/overview.html"
settings = "ui/settings.html"
overview_default = true
icon = "ui/icon.svg"
node_scope = "node"
permissions = ["backend", "agent", "media.record"]

[backend]
kind = "sidecar"
command = ["python3", "backend/server.py"]
health_path = "/health"
ready_timeout_ms = 15000
platforms = ["linux"]
python = ">=3.11"
sandbox = false
